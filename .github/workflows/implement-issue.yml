name: Implement project issue

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to implement or retry
        required: true
        type: number

concurrency:
  group: codex-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'codex:ready'
    runs-on: [self-hosted, Linux, trader-dev]
    timeout-minutes: 90
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and validate issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view "$ISSUE_NUMBER" --json body --jq .body > "$RUNNER_TEMP/issue-body.md"
          python3 scripts/development/validate_issue.py \
            --issue-body-file "$RUNNER_TEMP/issue-body.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create or reuse implementation branch
        env:
          BRANCH: ${{ steps.issue.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Run Codex implementation
        id: codex
        env:
          PROJECT_ISSUE_ID: ${{ steps.issue.outputs.project_issue }}
          PROJECT_ISSUE_DETAIL: ${{ steps.issue.outputs.detail_file }}
        run: |
          set +e
          CODEX_LOG="$RUNNER_TEMP/codex-exec.log"
          ROUTING_FILE="$RUNNER_TEMP/codex-model-routing.json"
          codex exec --sandbox read-only \
            --model gpt-5.6-terra \
            --config 'model_reasoning_effort="low"' \
            --output-last-message "$ROUTING_FILE" \
            "$(cat .github/codex/prompts/select-implementation-model.md)" \
            2>&1 | tee "$CODEX_LOG"
          CODEX_EXIT=${PIPESTATUS[0]}

          if [[ "$CODEX_EXIT" -eq 0 ]]; then
            MODEL="$(jq -er '.model | strings' "$ROUTING_FILE")"
            CODEX_EXIT=$?
          fi
          if [[ "$CODEX_EXIT" -eq 0 ]]; then
            REASONING_EFFORT="$(jq -er '.reasoning_effort | strings' "$ROUTING_FILE")"
            CODEX_EXIT=$?
          fi

          if [[ "$CODEX_EXIT" -eq 0 ]]; then
            case "$MODEL:$REASONING_EFFORT" in
              gpt-5.6-terra:medium|gpt-5.6-sol:medium|gpt-5.6-sol:high|gpt-6-astra:high) ;;
              *)
                echo "Unsupported Codex implementation profile: $MODEL:$REASONING_EFFORT" | tee -a "$CODEX_LOG" >&2
                CODEX_EXIT=1
                ;;
            esac
          fi

          if [[ "$CODEX_EXIT" -eq 0 ]]; then
            codex exec --sandbox workspace-write \
              --model "$MODEL" \
              --config "model_reasoning_effort=\"$REASONING_EFFORT\"" \
              --output-last-message codex-output.md \
              "$(cat .github/codex/prompts/implement-issue.md)" \
              2>&1 | tee -a "$CODEX_LOG"
            CODEX_EXIT=${PIPESTATUS[0]}
          fi

          if [[ "$CODEX_EXIT" -eq 0 ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          elif grep -Eqi "hit your usage limit|usage limit.*try again" "$CODEX_LOG"; then
            echo "status=usage_limit" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Checkpoint work deferred by Codex usage limit
        if: steps.codex.outputs.status == 'usage_limit'
        env:
          BRANCH: ${{ steps.issue.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          PROJECT_ISSUE: ${{ steps.issue.outputs.project_issue }}
        run: |
          rm -f codex-output.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [[ -n "$(git status --short)" ]]; then
            git add --all
            git commit -m "Checkpoint $PROJECT_ISSUE after Codex usage limit"
          fi
          git push --set-upstream origin "$BRANCH"
          gh label create codex:retry --color D4C5F9 \
            --description "Retry after the Codex usage allowance resets" --force
          gh issue edit "$ISSUE_NUMBER" --add-label codex:retry
          echo "Codex usage was exhausted. Partial work is on $BRANCH; a scheduled workflow will retry it."

      - name: Verify implementation
        if: steps.codex.outputs.status == 'success'
        env:
          PROJECT_ISSUE: ${{ steps.issue.outputs.project_issue }}
          DETAIL_FILE: ${{ steps.issue.outputs.detail_file }}
        run: |
          rm -f codex-output.md
          grep -Eq "^\\|[[:space:]]*$PROJECT_ISSUE[[:space:]]*\\|.*\\|[[:space:]]*new[[:space:]]*\\|" docs/issues/issues-index.md
          grep -q '^## Tests and Results' "$DETAIL_FILE"
          uv sync --frozen
          uv run pytest -m "not integration"
          npm --prefix src/product_components/monitoring_ui/frontend ci
          npm --prefix src/product_components/monitoring_ui/frontend run build
          git diff --check

      - name: Mark verified project issue resolved
        if: steps.codex.outputs.status == 'success'
        env:
          PROJECT_ISSUE: ${{ steps.issue.outputs.project_issue }}
        run: |
          python3 scripts/development/validate_issue.py \
            --mark-resolved \
            --project-issue "$PROJECT_ISSUE"

      - name: Commit, push, and create or update pull request
        if: steps.codex.outputs.status == 'success'
        env:
          BRANCH: ${{ steps.issue.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          PROJECT_ISSUE: ${{ steps.issue.outputs.project_issue }}
          DETAIL_FILE: ${{ steps.issue.outputs.detail_file }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [[ -n "$(git status --short)" ]]; then
            git add --all
            git commit -m "Resolve $PROJECT_ISSUE"
          fi
          git push --set-upstream origin "$BRANCH"

          PR_URL="$(gh pr list --head "$BRANCH" --json url --jq '.[0].url')"
          if [[ -z "$PR_URL" ]]; then
            printf 'Implements project issue %s.\n\nCloses #%s\n' "$PROJECT_ISSUE" "$ISSUE_NUMBER" > "$RUNNER_TEMP/pr-body.md"
            PR_URL="$(gh pr create --base main --head "$BRANCH" --title "Resolve $PROJECT_ISSUE" --body-file "$RUNNER_TEMP/pr-body.md")"
          fi
          sed -i "s|GitHub pull request: created by automation|GitHub pull request: $PR_URL|" "$DETAIL_FILE"
          if ! git diff --quiet -- "$DETAIL_FILE"; then
            git add "$DETAIL_FILE"
            git commit -m "Document pull request for $PROJECT_ISSUE"
            git push origin "$BRANCH"
          fi

          if gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' | grep -Fxq codex:retry; then
            gh issue edit "$ISSUE_NUMBER" --remove-label codex:retry
          fi

      - name: Report deferred or failed Codex execution
        if: steps.codex.outputs.status != 'success'
        env:
          CODEX_STATUS: ${{ steps.codex.outputs.status }}
        run: |
          if [[ "$CODEX_STATUS" == "usage_limit" ]]; then
            echo "Codex usage limit reached; checkpointed for scheduled retry." >&2
          else
            echo "Codex failed for a reason that is not eligible for automatic retry." >&2
          fi
          exit 1
